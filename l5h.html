<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060b">
<title>L5H</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060b;--ink:#f3f0ea;--mute:#b2b6c2;--card:rgba(10,12,22,.55);--line:rgba(255,255,255,.18);--amber:#ffb24a;--shadow:rgba(0,0,0,.75);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
.street{position:absolute;inset:0;width:100%;height:100%;animation:fade 1.6s ease both}
.far{transform:translate(calc(var(--px,0)*.4px),calc(var(--py,0)*.2px));transition:transform .6s ease-out}
.mid{transform:translate(calc(var(--px,0)*.7px),calc(var(--py,0)*.3px));transition:transform .6s ease-out}
.near{transform:translate(calc(var(--px,0)*1.2px),calc(var(--py,0)*.5px));transition:transform .6s ease-out}
.fl{animation:flick 6s infinite}.sh{animation:shim 4s ease-in-out infinite alternate}.lp{animation:lamp 5s ease-in-out infinite alternate}
.car{animation:go1 16s linear infinite}.c2{animation:go2 22s linear 3s infinite}
.veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,6,11,.5),rgba(5,6,11,.25) 35%,rgba(5,6,11,.55) 100%)}
.bg canvas{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen}
.wrap{max-width:440px;margin:0 auto;padding:44px 22px 56px}
.photo{position:relative;margin:0;border-radius:26px;overflow:hidden;box-shadow:0 30px 60px -20px var(--shadow),0 0 0 1px var(--line);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;animation:focus 1.3s cubic-bezier(.2,.7,.2,1) backwards}
.photo::before{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;z-index:3;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-12deg);animation:sweep 6s ease-in-out 2.2s infinite}
.photo::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.28),transparent 55%);opacity:var(--go,0);transition:opacity .3s}
.photo canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.photo img{display:block;width:100%;aspect-ratio:4/4.6;object-fit:cover;object-position:50% 30%;animation:kb 14s ease-in-out infinite alternate}
.name{direction:ltr;margin:30px 0 0;font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(72px,24vw,104px);line-height:.95;text-align:center;text-shadow:0 0 30px rgba(255,79,154,.45)}
.name span{display:inline-block;opacity:0;transform:translateY(24px);filter:blur(8px);animation:letter .9s cubic-bezier(.2,.8,.2,1) forwards}
.name span:nth-child(1){animation-delay:.7s}.name span:nth-child(2){animation-delay:.82s}.name span:nth-child(3){animation-delay:.94s}
.tag{text-align:center;color:var(--mute);margin:8px 0 28px;opacity:0;animation:fadeup .8s ease 1.4s forwards}
.links{display:flex;flex-direction:column;gap:10px}
a.row{direction:ltr;display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:16px;color:var(--ink);text-decoration:none;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;transform:translateY(16px);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .25s,box-shadow .25s,border-color .25s}
a.row:nth-child(1){animation-delay:1.5s}a.row:nth-child(2){animation-delay:1.6s}a.row:nth-child(3){animation-delay:1.7s}a.row:nth-child(4){animation-delay:1.8s}
a.row:hover,a.row:focus-visible{transform:translateY(-3px);border-color:var(--amber);box-shadow:0 14px 34px -14px rgba(255,79,154,.6)}
a.row:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
a.row:active{transform:scale(.985)}
.ic{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);transition:background .25s,color .25s,border-color .25s}
.ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
a.row:hover .ic{background:var(--amber);color:#0b0c0e;border-color:var(--amber)}
.t{display:flex;flex-direction:column;flex:1;min-width:0;gap:2px}
.p{font-weight:600;font-size:17px}.h{font-size:14px;color:var(--mute)}
.ch{width:20px;height:20px;flex:none;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s,stroke .3s}
a.row:hover .ch{stroke:var(--amber);transform:translateX(-5px)}
@keyframes flick{0%,18%,22%,60%,64%,100%{opacity:1}20%,62%{opacity:.35}66%{opacity:.8}}
@keyframes shim{from{opacity:.5}to{opacity:1}}
@keyframes lamp{from{opacity:.75}to{opacity:1}}
@keyframes go1{from{transform:translateX(-200px)}to{transform:translateX(1800px)}}
@keyframes go2{from{transform:translateX(1800px)}to{transform:translateX(-200px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeup{to{opacity:1}}
@keyframes focus{from{opacity:0;filter:blur(22px);transform:scale(1.04)}to{opacity:1;filter:none;transform:none}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09) translate(-1.5%,1.5%)}}
@keyframes sweep{0%{left:-60%}35%,100%{left:130%}}
@keyframes letter{to{opacity:1;transform:none;filter:none}}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.name span,.tag,a.row{opacity:1;transform:none;filter:none}.bg canvas{display:none}}
@media (min-width:820px){.wrap{padding-top:7vh}}
</style>
</head>

<script>(function(){
if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
var bg=document.querySelector('.bg'),ph=document.getElementById('photo');
addEventListener('pointermove',function(e){bg.style.setProperty('--px',(e.clientX/innerWidth-.5)*-30);bg.style.setProperty('--py',(e.clientY/innerHeight-.5)*-30)});
ph.addEventListener('pointermove',function(e){var r=ph.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
ph.style.setProperty('--ry',(x-.5)*12+'deg');ph.style.setProperty('--rx',(y-.5)*-12+'deg');ph.style.setProperty('--gx',x*100+'%');ph.style.setProperty('--gy',y*100+'%');ph.style.setProperty('--go',1)});
ph.addEventListener('pointerleave',function(){ph.style.setProperty('--rx','0deg');ph.style.setProperty('--ry','0deg');ph.style.setProperty('--go',0)});
var run=true;document.addEventListener('visibilitychange',function(){run=!document.hidden});
function rain(cv,box,dens,al){var ctx=cv.getContext('2d'),w=0,h=0,d=[];
function mk(r){return{x:Math.random()*(w+60)-30,y:r?Math.random()*h:-30,l:10+Math.random()*20,s:7+Math.random()*9,a:(.1+Math.random()*.25)*al}}
function size(){var q=Math.min(devicePixelRatio||1,2);w=box.clientWidth;h=box.clientHeight;cv.width=w*q;cv.height=h*q;ctx.setTransform(q,0,0,q,0,0);d=[];for(var i=0;i<Math.round(w*h/dens);i++)d.push(mk(true))}
function f(){if(run){ctx.clearRect(0,0,w,h);ctx.lineWidth=1;ctx.lineCap='round';for(var i=0;i<d.length;i++){var p=d[i];ctx.strokeStyle='rgba(215,228,255,'+p.a+')';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.l*.18,p.y+p.l);ctx.stroke();p.y+=p.s;p.x-=p.s*.18;if(p.y>h+30)d[i]=mk(false)}}requestAnimationFrame(f)}
addEventListener('resize',size);size();f()}
rain(document.getElementById('rain'),ph,8000,1);
rain(document.getElementById('bgrain'),bg,14000,.8);
document.querySelectorAll('a.row').forEach(function(a){a.addEventListener('animationend',function(){a.style.animation='none';a.style.opacity='1';a.style.transform=''})});
})();</script>
